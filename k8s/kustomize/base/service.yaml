apiVersion: v1
kind: Service
metadata:
  name: spliit-mcp
  labels:
    app.kubernetes.io/name: spliit-mcp
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: spliit-mcp
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: spliit-mcp-frontend
  labels:
    app.kubernetes.io/name: spliit-mcp
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: spliit-mcp
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
