apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp

resources:
  - ../../base

images:
  - name: ghcr.io/daedaluz/spliit-mcp
    newTag: latest
  - name: ghcr.io/daedaluz/spliit-mcp-frontend
    newTag: latest

patches:
  - path: httproute-host.yaml
  - path: pull-secret.yaml

configMapGenerator:
  - name: spliit-mcp
    behavior: merge
    literals:
      # Must match the hostname clients actually use: the OIDC redirect URI and
      # the MCP token audience are both built from it.
      - SPLIIT_MCP_PUBLIC_URL=https://spliit-mcp.inits.se

      - SPLIIT_MCP_OIDC_ISSUER=https://authz.se
      - SPLIIT_MCP_OIDC_CLIENT_ID=6f8f1f8b-cec3-4f6a-bc86-9fe95334833e

      # authz.se puts client and project IDs in `aud` rather than the resource
      # URL, so a resource-bound audience check cannot pass. Set
      # SPLIIT_MCP_OIDC_MCP_CLIENT_ID to a pre-registered MCP client and remove
      # this to restore replay protection.
      - SPLIIT_MCP_OIDC_SKIP_AUDIENCE_CHECK=true

      # The Spliit instance in this cluster, seeded for new users. Reached over
      # the cluster network, not its public hostname.
      - SPLIIT_MCP_SPLIIT_DEFAULT_URL=http://spliit.spliit.svc.cluster.local:3000/api/trpc
      - SPLIIT_MCP_SPLIIT_DEFAULT_NAME=spliit
