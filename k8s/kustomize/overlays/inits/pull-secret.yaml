# The GHCR packages are private, so both deployments need a pull secret. Drop
# this patch once the packages are made public.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spliit-mcp
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spliit-mcp-frontend
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
